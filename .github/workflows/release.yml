name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave blank to use tag from ref or build.gradle.kts)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Release title (leave blank for automatic title)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION_NAME=$(grep 'versionName' app/app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
            TAG="v${VERSION_NAME:-1.0.0}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_name }}" ]; then
            RELEASE_TITLE="${{ inputs.release_name }}"
          else
            RELEASE_TITLE="SugrNote ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=SugrNote-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        working-directory: ./app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi

          SIGNED_APK="${{ steps.vars.outputs.apk_name }}"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing APK with repository keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            "$APKSIGNER" sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$SIGNED_APK" \
              "$UNSIGNED_APK"
            rm -f release.keystore
          else
            echo "No custom keystore secrets configured. Generating a self-signed release key..."
            keytool -genkeypair -v \
              -keystore temp.keystore \
              -alias sugrnote \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass sugrnote \
              -keypass sugrnote \
              -dname "CN=SugrNote, OU=Release, O=SugrNote, L=Global, S=Global, C=US"
            "$APKSIGNER" sign --ks temp.keystore \
              --ks-key-alias sugrnote \
              --ks-pass "pass:sugrnote" \
              --key-pass "pass:sugrnote" \
              --out "$SIGNED_APK" \
              "$UNSIGNED_APK"
            rm -f temp.keystore
          fi

          echo "Verifying signed APK..."
          "$APKSIGNER" verify -v "$SIGNED_APK"

      - name: Generate Checksums
        run: |
          APK_FILE="${{ steps.vars.outputs.apk_name }}"
          sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
          echo "SHA256 Checksum:"
          cat "${APK_FILE}.sha256"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.apk_name }}
          path: |
            ${{ steps.vars.outputs.apk_name }}
            ${{ steps.vars.outputs.apk_name }}.sha256
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          files: |
            ${{ steps.vars.outputs.apk_name }}
            ${{ steps.vars.outputs.apk_name }}.sha256
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
